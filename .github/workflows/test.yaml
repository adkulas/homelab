name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install acceptance test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y age openssl python3
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/sops" https://github.com/getsops/sops/releases/download/v3.13.3/sops-v3.13.3.linux.amd64
          echo "e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b  $RUNNER_TEMP/sops" | sha256sum -c -
          sudo install -m 0755 "$RUNNER_TEMP/sops" /usr/local/bin/sops
      - run: go vet ./...
      - name: Validate rendered Compose
        run: |
          set -o pipefail
          go run ./cmd/media-stack plan --environment staging | docker compose -f - config --quiet
      - run: go test ./...

  pinned-qbittorrent-contract:
    runs-on: ubuntu-latest
    env:
      MEDIA_STACK_LIVE_QBITTORRENT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./internal/engine -run TestPinnedQBittorrentBootstrapRestartAndPeerContract -count=1 -v
