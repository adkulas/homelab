# Reusable Media Stack policy. Deployment inputs and credentials belong to Site Inventory.
apiVersion: homelab.media-stack/v1alpha1
kind: MediaStack
spec:
    acquisition:
        publicTorrentSources:
        -   id: internetarchive
            enabled: true
        vpn:
            provider: nordvpn
            protocol: openvpn
            openvpnProtocol: udp
            server:
                countries:
                - Canada
                categories:
                - P2P
            catalogueUpdateInterval: 480h
