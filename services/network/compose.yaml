# Primary DNS Stack Instance only. Follow docs/primary-dns.md before first start.
name: homelab-dns
services:
  primary:
    image: ${TECHNITIUM_IMAGE:?Use --env-file services/network/technitium.env}
    network_mode: host
    restart: unless-stopped
    environment:
      DNS_SERVER_DOMAIN: homelab.home
      DNS_SERVER_ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      DNS_SERVER_WEB_SERVICE_LOCAL_ADDRESSES: 127.0.0.1
      DNS_SERVER_WEB_SERVICE_HTTP_PORT: "5380"
      DNS_SERVER_RECURSION: UseSpecifiedNetworkACL
      DNS_SERVER_RECURSION_NETWORK_ACL: ${PRIMARY_RECURSION_ACL:?Set explicit trusted LAN/VPN networks}
      DNS_SERVER_ENABLE_BLOCKING: "true"
    secrets: [admin_password]
    volumes:
      - type: bind
        source: ${PRIMARY_CONFIG_DIR:?Set a new private absolute configuration directory outside Git}
        target: /etc/dns
        bind:
          create_host_path: false
secrets:
  admin_password:
    file: ${PRIMARY_PASSWORD_FILE:?Set a private absolute password-file path outside Git}
