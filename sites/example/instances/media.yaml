apiVersion: homelab.site/v1alpha1
kind: StackInstance
metadata:
    name: media
spec:
    stack: media
    host: media
    runtimeIdentity: example-media
    media:
        defaults:
            timezone: America/Toronto
            runtimeUID: 1000
            runtimeGID: 1000
            lanBindAddress: 0.0.0.0
            backupRetention:
                daily: 7
                weekly: 4
                monthly: 6
        environments:
            production:
                projectName: media-production
                dataRoot: /srv/media/production
                backupRoot: /mnt/backups/media/production
                secretsFile: secrets/production.sops.yaml
                hardwareTranscoding: auto
                ports:
                    qbittorrent: 8080
                    prowlarr: 9696
                    sonarr: 8989
                    radarr: 7878
                    profilarr: 6868
                    jellyfin: 8096
                    seerr: 5055
            staging:
                projectName: media-staging
                dataRoot: /srv/media/staging
                backupRoot: /mnt/backups/media/staging
                secretsFile: secrets/staging.sops.yaml
                hardwareTranscoding: auto
                ports:
                    qbittorrent: 18080
                    prowlarr: 19696
                    sonarr: 18989
                    radarr: 17878
                    profilarr: 16868
                    jellyfin: 18096
                    seerr: 15055
